entrypoint = "ff4.s"
module-paths = ["build/obj", "src/lang/fr", "src"]  # build.py swaps the language (FF4_LANG)
include-paths = ["src/lang/fr", "src", "build/gen", "src_assets"]  # sources, generated assets, hand-kept inputs
rom_size = 0x200000  # 2 MB patched image

# Bus map, seeded onto every module (no source `.map` lines).
[map.1]  # LoROM ROM, mirrored at $80-$CF
address = "00-6f,80-cf:8000-ffff"
mask = 0x8000

[map.2]  # console WRAM
address = "7e-7f:0000-ffff"
writable = true

[map.3]  # cart SRAM: header patched to 128KB, cleared at boot, ours alone
address = "70-73:0000-7fff"
mask = 0x8000
writable = true

# Names the sources may test, at their release values: a bare build ships clean. Dev builds (`make`,
# `build.py --dev`) override them (build.py DEV_DEFINES).
[defines]
LANG = "fr"
DEBUG = 0  # 1: the build date before the version on the title screen
VERSION = "dev"  # shown on the title screen; release builds take the tag (build.py, FF4_VERSION)
TREASURE_DEBUG_ALWAYS_DROP = 0  # 1: every won battle drops an item, so hunts and playtests reach the treasure screens
ENABLE_BRK_HANDLER = 1  # a BRK halts on a trap screen instead of running into garbage
TRIGGER_ENDING_CUTSCENE = 0  # 1: boot straight into the ending
DEBUG_SHOW_ITEM_WINDOW = 0
