repos:
  - repo: local
    hooks:
      - id: a816-fluff
        name: a816 fluff format check
        description: Verify .s/.i sources match a816-fluff canonical formatting.
        entry: a816-fluff format --check
        language: python
        additional_dependencies: ["a816==1.1.0a14"]
        files: \.(s|i)$
        require_serial: true
        pass_filenames: true
