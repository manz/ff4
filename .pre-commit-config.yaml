repos:
  - repo: local
    hooks:
      - id: a816-format
        name: a816 format --check
        description: Verify .s/.i sources match a816 canonical formatting.
        entry: a816 format --check
        language: system
        files: \.(s|i)$
        require_serial: true
        pass_filenames: true
      - id: a816-check
        name: a816 check (lint)
        description: Run a816 fluff lints (DOC*, N*, E*) on .s/.i sources.
        entry: a816 check
        language: system
        files: \.(s|i)$
        require_serial: true
        pass_filenames: true
