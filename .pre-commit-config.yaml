repos:
  - repo: local
    hooks:
      - id: a816-fluff
        name: a816 fluff format check
        description: Verify .s/.i sources match a816-fluff canonical formatting.
        entry: a816-fluff format --check
        language: python
        additional_dependencies: ["a816==1.1.0a8"]
        files: \.(s|i)$
        # window_animation_patches.s uses `:` chained statements which the
        # current fluff parser rejects.
        exclude: ^src/ingame/window_animation_patches\.s$
        require_serial: true
        pass_filenames: true
