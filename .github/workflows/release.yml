name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - uses: manz/a816/actions/setup@v1.2.0
    - uses: manz/a816/actions/decrypt-rom@v1.2.0
      with:
        passphrase: ${{ secrets.FF4_PASSWORD }}
        encrypted: ff4.sfc.gz.gpg
        to: build/ff4.sfc
    - name: Build release patches
      env:
        FF4_VERSION: ${{ github.ref_name }}
      run: |
        uv run ./build.py
        FF4_LANG=en uv run ./build.py
    - uses: manz/a816/actions/seal@v1.2.0
      with:
        rom: build/ff4.sfc
        patches: |
          build/release/ff4.ips
          build/release/ff4.bps.unsealed
          build/en/release/ff4.ips
          build/en/release/ff4.bps.unsealed
    - name: Package
      run: |
        mkdir -p dist/fr dist/en
        cp build/release/ff4.ips build/release/ff4.bps dist/fr/
        uv run python -m utils.lisezmoi release/LISEZMOI.txt ${{ github.ref_name }} > dist/fr/LISEZMOI.txt
        (cd dist/fr && zip -X ../../ff4-fr-${{ github.ref_name }}.zip ff4.ips ff4.bps LISEZMOI.txt)
        cp build/en/release/ff4.ips build/en/release/ff4.bps dist/en/
        uv run python -m utils.lisezmoi release/README.txt ${{ github.ref_name }} en > dist/en/README.txt
        (cd dist/en && zip -X ../../ff4-en-${{ github.ref_name }}.zip ff4.ips ff4.bps README.txt)
    - uses: manz/a816/actions/release@v1.2.0
      with:
        title: Final Fantasy IV ${{ github.ref_name }}
        assets: |
          ff4-fr-${{ github.ref_name }}.zip
          ff4-en-${{ github.ref_name }}.zip
