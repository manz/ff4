name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: '3.14'
        enable-cache: true
    - name: Install Requirements
      run: uv sync --locked
    - name: Build patch
      run: uv run ./build.py
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: build/ff4.ips
        generate_release_notes: true