name: PR Build

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
    - uses: manz/a816/actions/setup@v1.1.7
    - id: rom
      uses: manz/a816/actions/decrypt-rom@v1.1.7
      with:
        passphrase: ${{ secrets.FF4_PASSWORD }}
        encrypted: ff4.sfc.gz.gpg
        to: build/ff4.sfc

    - name: Build patch
      if: steps.rom.outputs.available == 'true'
      run: uv run ./build.py --dev

    - name: Run tests
      if: steps.rom.outputs.available == 'true'
      run: uv run pytest -n auto

    - if: steps.rom.outputs.available == 'true'  # build/gen, which the sources include, comes from the build
      uses: manz/a816/actions/lint@v1.1.7

    - if: steps.rom.outputs.available == 'true'
      uses: manz/a816/actions/seal@v1.1.7
      with:
        rom: build/ff4.sfc
        patches: |
          build/ff4.ips
          build/ff4.bps.unsealed

    - if: always() && steps.rom.outputs.available == 'true'
      uses: manz/a816/actions/pr-artifact@v1.1.7
      with:
        name: ff4-ips
        files: |
          build/ff4.ips
          build/ff4.bps
        marker: FF4-IPS-BUILD-COMMENT
        title: FF4 IPS
        outcome: ${{ job.status }}
