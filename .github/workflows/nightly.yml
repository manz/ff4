name: Nightly Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: nightly

jobs:
  nightly:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - uses: manz/a816/actions/setup@v1.1.7
    - uses: manz/a816/actions/decrypt-rom@v1.1.7
      with:
        passphrase: ${{ secrets.FF4_PASSWORD }}
        encrypted: ff4.sfc.gz.gpg
        to: build/ff4.sfc
    - name: Build patches
      run: |
        uv run ./build.py --dev
        FF4_LANG=en uv run ./build.py --dev
    - uses: manz/a816/actions/seal@v1.1.7
      with:
        rom: build/ff4.sfc
        patches: |
          build/ff4.ips
          build/ff4.bps.unsealed
          build/en/ff4.ips
          build/en/ff4.bps.unsealed
    - name: Name patches
      run: |
        mkdir -p dist
        cp build/ff4.ips dist/ff4-fr.ips
        cp build/ff4.bps dist/ff4-fr.bps
        cp build/en/ff4.ips dist/ff4-en.ips
        cp build/en/ff4.bps dist/ff4-en.bps
    - uses: manz/a816/actions/nightly@v1.1.7
      with:
        files: |
          dist/ff4-fr.ips
          dist/ff4-fr.bps
          dist/ff4-en.ips
          dist/ff4-en.bps
