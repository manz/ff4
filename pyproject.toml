# Dependency + build configuration for the patch tooling.
#
# This repository builds a ROM patch rather than a library: nothing here is
# imported from outside, so the wheel carries no packages and `uv sync`
# exists to pull the locked dependencies (dev group included) in one step.
[project]
name = "ff4"
description = "Final Fantasy IV French translation patch"
authors = [{ name = "Emmanuel Peralta", email = "manz@ringum.net" }]
requires-python = ">=3.14"

dependencies = [
    "a816==1.3.0a3",
    "katsuji[render]==0.6.0a2",
    "kintsuki==0.0.0a21",
]

dynamic = ["version"]

[dependency-groups]
# `make tests` invokes pytest, on every core (pytest-xdist: each test boots its own emulator); uv installs the dev
# group by default.
dev = ["pytest", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "hatch_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
bypass-selection = true
