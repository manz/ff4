# Dependency + build configuration for the patch tooling.
#
# This repository builds a ROM patch rather than a library: nothing here is
# imported from outside, so the wheel carries no packages and `uv sync`
# exists to pull the locked dependencies (dev group included) in one step.
[project]
name = "ff4"
description = "Final Fantasy IV French translation patch"
authors = [{ name = "Emmanuel Peralta", email = "manz@ringum.net" }]
requires-python = ">=3.14"

dependencies = [
    "a816==1.1.0a42",
    "kintsuki[visual]==0.0.0a16",
]

dynamic = ["version"]

[dependency-groups]
# `make tests` invokes pytest; uv installs the dev group by default.
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "hatch_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
bypass-selection = true
